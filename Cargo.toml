[package]
name = "paperlint"
version = "0.1.0"
edition = "2024"
authors = ["Jiaqi Cheng <cheng20070225@outlook.com>"]
description = "A linter for Chinese and English academic papers written in LaTeX"
repository = "https://github.com/modenicheng/paperlint"
homepage = "https://github.com/modenicheng/paperlint"
license = "MIT"
keywords = ["latex", "linter", "chinese", "academic", "nlp"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
jieba-rs = "0.7.0"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = { version = "0.9.7", features = ["parse", "serde"] }
tree-sitter = "0.25.10"
tree-sitter-latex = "0.1.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

[lints.rust]
unsafe_code = "forbid"
