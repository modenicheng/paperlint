[package]
name = "paperlint"
version = "0.1.0"
edition = "2024"
authors = ["Jiaqi Cheng <cheng20070225@outlook.com>"]
description = "A linter for Chinese and English academic papers written in LaTeX"
repository = "https://github.com/modenicheng/paperlint"
homepage = "https://github.com/modenicheng/paperlint"
license = "MIT"
keywords = ["latex", "linter", "chinese", "academic", "nlp"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
concolor = { version = "0.1.1", features = ["api", "auto"] }
jieba-rs = "0.7.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = { version = "0.9.12", features = ["parse", "serde"] }
tree-sitter = "0.25.10"
tree-sitter-latex = { package = "codebook-tree-sitter-latex", version = "0.6.1" }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
